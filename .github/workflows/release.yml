name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0" # cross-compiling this matrix stays a plain loop, no
                        # cross-toolchain problem, because modernc.org/sqlite
                        # is pure Go (see docs/architecture.md).
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # This job's token has contents: write (it publishes the
          # release); persisting it in .git/config for the rest of the job
          # would let any step after this one - go test, a dependency's
          # build script - read it out of a world-readable file instead of
          # only the steps that actually need it (softprops/action-gh-
          # release takes its own token as an explicit input, not from
          # persisted git credentials).
          persist-credentials: false

      # `stable` with check-latest is a moving tag: it always resolves to
      # the newest stable Go release rather than pinning the go.mod
      # directive's minimum (which, left running long enough, drifts behind
      # upstream security fixes - see the govulncheck job in ci.yml). CI
      # keeps one leg on the go.mod minimum to prove that floor still
      # builds; release always ships on current Go.
      - name: Set up Go (stable)
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      # A tag pushed from a local branch that never ran CI must not publish
      # a release built from untested code: gate the build on the same
      # checks CI runs, against this exact tagged commit.
      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      # The Makefile owns the actual build recipe (targets, -trimpath,
      # -ldflags, SHA256SUMS) so there is exactly one place that knows it,
      # not one copy here and one in `make release` that can drift apart.
      # VERSION is passed through env, not interpolated straight into run:
      # a tag name can contain shell metacharacters ($, (), ;) that git
      # itself allows, and an expression substituted directly into a run:
      # block is not shell-quoted the way an env var expansion is.
      - name: Build release artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: make release VERSION="$VERSION"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
          generate_release_notes: true
          body: |
            Every target is cross-compiled with `CGO_ENABLED=0` (the sqlite
            driver, modernc.org/sqlite, is pure Go, so this needs no
            cross-toolchain). This workflow itself only executes `go vet`/
            `go test` on the runner's own linux/amd64 host before building -
            it does not run any of the produced binaries, on this or any
            other target.

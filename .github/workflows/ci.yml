name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # go vet and go build stay CGO-free, matching how mtclaw is actually
      # released (see release.yml): a plain matrix loop, no cross-toolchain
      # problem, because modernc.org/sqlite is pure Go.
      - name: go vet (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
        run: go vet ./...

      - name: go build (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
        run: go build ./...

      # Exercises the exact CGO-free path the Makefile's own `test` target
      # and every released binary use (modernc.org/sqlite is pure Go), which
      # the CGO-enabled -race run below does not cover.
      - name: go test (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      # One leg is enough: the result does not depend on the OS running it.
      - name: go mod tidy -diff
        if: matrix.os == 'ubuntu-latest'
        run: go mod tidy -diff

      - name: gofmt check
        if: runner.os != 'Windows'
        run: |
          fmtOut="$(gofmt -l .)"
          if [ -n "$fmtOut" ]; then
            echo "gofmt found unformatted files:"
            echo "$fmtOut"
            exit 1
          fi

      - name: gofmt check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fmtOut = gofmt -l .
          if ($fmtOut) {
            Write-Host "gofmt found unformatted files:"
            Write-Host $fmtOut
            exit 1
          }

      # -race needs cgo (a real C compiler), independent of the CGO-free
      # release build above. Current windows-latest images ship MinGW gcc
      # on PATH; this step only installs one if that ever stops being true.
      - name: Ensure a C compiler for -race (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Get-Command gcc -ErrorAction SilentlyContinue) {
            gcc --version | Select-Object -First 1
          } else {
            choco install mingw -y --no-progress
            echo "C:\ProgramData\mingw64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          }

      - name: go test -race ./...
        env:
          CGO_ENABLED: "1"
        run: go test -race -v ./... 2>&1 | tee test-output.log
        shell: bash

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}
          path: test-output.log

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, go.mod minimum)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Pins this leg to exactly the go.mod minimum (go-version-file
      # installs the go directive's version, not a moving one), so a
      # regression against the oldest Go this project claims to support is
      # caught here - see the test-stable job for the moving `stable` tag
      # every actual release is built with.
      - name: Set up Go (go.mod minimum)
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # go vet and go build stay CGO-free, matching how mtclaw is actually
      # released (see release.yml): a plain matrix loop, no cross-toolchain
      # problem, because modernc.org/sqlite is pure Go.
      - name: go vet (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
        run: go vet ./...

      - name: go build (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
        run: go build ./...

      # Exercises the exact CGO-free path the Makefile's own `test` target
      # and every released binary use (modernc.org/sqlite is pure Go), which
      # the CGO-enabled -race run below does not cover.
      - name: go test (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      # One leg is enough: the result does not depend on the OS running it.
      - name: go mod tidy -diff
        if: matrix.os == 'ubuntu-latest'
        run: go mod tidy -diff

      # Same single leg: .golangci.yml pins the linter set, so the result
      # is OS-independent too. `make lint` runs the same command locally.
      - name: golangci-lint
        if: matrix.os == 'ubuntu-latest'
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: gofmt check
        if: runner.os != 'Windows'
        run: |
          fmtOut="$(gofmt -l .)"
          if [ -n "$fmtOut" ]; then
            echo "gofmt found unformatted files:"
            echo "$fmtOut"
            exit 1
          fi

      - name: gofmt check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fmtOut = gofmt -l .
          if ($fmtOut) {
            Write-Host "gofmt found unformatted files:"
            Write-Host $fmtOut
            exit 1
          }

      # -race needs cgo (a real C compiler), independent of the CGO-free
      # release build above. Current windows-latest images ship MinGW gcc
      # on PATH; this step only installs one if that ever stops being true.
      - name: Ensure a C compiler for -race (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Get-Command gcc -ErrorAction SilentlyContinue) {
            gcc --version | Select-Object -First 1
          } else {
            choco install mingw -y --no-progress
            echo "C:\ProgramData\mingw64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          }

      - name: go test -race ./...
        env:
          CGO_ENABLED: "1"
        run: go test -race -v ./... 2>&1 | tee test-output.log
        shell: bash

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-output-${{ matrix.os }}
          path: test-output.log

  test-stable:
    # A single ubuntu leg on the moving `stable` tag: this is the toolchain
    # release.yml actually builds with, so a build/vet/test regression that
    # only shows up on a newer Go than go.mod's minimum is caught here
    # instead of first being discovered by a tag push. check-latest ensures
    # the runner's own cached "stable" alias can never be stale.
    name: test (ubuntu-latest, stable Go)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go (stable)
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

  govulncheck:
    # golang/govulncheck-action manages its own Go install (no separate
    # checkout/setup-go step needed) and checks out the repo itself.
    name: govulncheck (stable Go)
    runs-on: ubuntu-latest
    steps:
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: stable
          check-latest: true
